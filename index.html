<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal - AMHEEX VPS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body { background-color: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .termux-bar { background: #121212; color: #fff; padding: 6px 15px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; flex-shrink: 0; gap: 5px; flex-wrap: wrap; }
        .termux-bar span { color: #aaa; font-weight: bold; }
        .status-erro { color: #ff3333 !important; }
        .status-online { color: #00ff66 !important; }

        .action-toggle-container { display: flex; align-items: center; gap: 5px; }
        .btn-action { background: #222; border: 1px solid #444; color: #fff; padding: 2px 6px; font-size: 10px; cursor: pointer; border-radius: 3px; font-family: monospace; }
        .btn-action.active-true { background: #00aa55; border-color: #00ff66; color: #000; font-weight: bold; }
        .btn-action.active-false { background: #aa0000; border-color: #ff3333; color: #fff; font-weight: bold; }

        .terminal-screen { flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; background: #000; color: #fff; cursor: text; -webkit-overflow-scrolling: touch; }
        
        .txt-branco { color: #fff; }
        .txt-verde { color: #00ff66; }
        .txt-vermelho { color: #ff4444; }
        .txt-amarelo { color: #ffeb3b; }
        .txt-azul { color: #4fc3f7; }

        /* Estilo do Diálogo Flutuante */
        #modal-aviso {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #modal-aviso.visivel {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-conteudo {
            background: #111;
            border: 1px solid #ff3333;
            padding: 20px 25px;
            border-radius: 6px;
            text-align: center;
            max-width: 85%;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }
        .modal-conteudo h3 {
            color: #ff3333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .modal-conteudo p {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .modal-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 6px 15px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Input invisível posicionado de forma a aceitar foco nativo no mobile */
        #input-invisivel {
            position: absolute;
            opacity: 0;
            bottom: 0;
            left: 0;
            height: 1px;
            width: 1px;
            border: none;
            outline: none;
            background: transparent;
            color: transparent;
            pointer-events: auto;
        }
    </style>
</head>
<body onclick="focarInput()">

    <!-- Diálogo Flutuante -->
    <div id="modal-aviso">
        <div class="modal-conteudo">
            <h3>ATENÇÃO</h3>
            <p>Nenhuma máquina encontrada com tempo de expiração válido acima de 0s!</p>
            <button class="modal-btn" onclick="fecharModalAviso()">OK</button>
        </div>
    </div>

    <div class="termux-bar">
        <div>ID: <span id="info-id">procurando...</span></div>
        <div>Status: <span id="status-conexao" class="status-erro">Aguardando ID</span></div>
        <div class="action-toggle-container">
            Action: <button id="btnActionToggle" class="btn-action active-true" onclick="alternarActionFirebase()">TRUE</button>
        </div>
        <div>Expira: <span id="tempo-decorrido">0</span>s</div>
    </div>

    <div id="resposta-terminal" class="terminal-screen txt-branco" onclick="focarInput()">root@AMHEEX-VPS ~# Inicializando conexão...</div>

    <input type="text" id="input-invisivel" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>

    <script>
        const FIREBASE_HOST = "https://amheexvps-default-rtdb.firebaseio.com";
        let meuIdAtual = "";
        let intervaloMonitoramento = null;
        let ultimaRespostaProcessada = "";
        let ultimaCorProcessada = "";
        let comandoAtualDigitando = "";
        let estadoActionAtual = true;
        let modoManualUrl = false;
        let segundosExpiracaoUrl = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idDaUrl = urlParams.get('id');
            const actionDaUrl = urlParams.get('action');
            
            segundosExpiracaoUrl = urlParams.get('expiration');

            if (actionDaUrl !== null) {
                let actStr = actionDaUrl.toLowerCase().trim();
                estadoActionAtual = (actStr === 'true' || actStr === '1' || actStr === 'yes');
                atualizarBotaoActionVisual();
            }

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    document.body.style.height = window.visualViewport.height + 'px';
                    let term = document.getElementById('resposta-terminal');
                    term.scrollTop = term.scrollHeight;
                });
            }

            if (idDaUrl && idDaUrl.trim() !== "") {
                modoManualUrl = true;
                conectarESincronizarID(idDaUrl.trim(), "Conectado via URL à sandbox");
            } else {
                procurarEConectarIPAtivo();
                setInterval(procurarEConectarIPAtivo, 3000);
            }
            
            window.addEventListener('resize', () => {
                let term = document.getElementById('resposta-terminal');
                term.scrollTop = term.scrollHeight;
            });

            let inputInv = document.getElementById('input-invisivel');
            
            inputInv.addEventListener('input', function(e) {
                comandoAtualDigitando = e.target.value;
                atualizarUltimaLinhaTerminal();
            });

            inputInv.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (comandoAtualDigitando.trim()) {
                        enviarComandoDireto(comandoAtualDigitando);
                    }
                }
            });
        };

        function focarInput() {
            let input = document.getElementById('input-invisivel');
            if (!input.disabled) {
                input.focus();
            }
        }

        function alterarEstadoControles(ativo) {
            let input = document.getElementById('input-invisivel');
            input.disabled = !ativo;
            if (ativo) {
                setTimeout(focarInput, 50);
            }
        }

        function mostrarModalAviso() {
            if (modoManualUrl) return;
            let modal = document.getElementById('modal-aviso');
            if (!modal.classList.contains('visivel')) {
                modal.classList.add('visivel');
            }
        }

        function fecharModalAviso() {
            let modal = document.getElementById('modal-aviso');
            modal.classList.remove('visivel');
            focarInput();
        }

        function apagarSandboxExpirada(idParaApagar) {
            fetch(`${FIREBASE_HOST}/STORAGE/${idParaApagar}.json`, { method: 'DELETE' })
                .catch(err => console.error("Erro ao apagar sandbox:", err));
        }

        function conectarESincronizarID(id, mensagemConexao) {
            meuIdAtual = id;
            fecharModalAviso();
            document.getElementById('info-id').innerText = meuIdAtual;
            let statusElem = document.getElementById('status-conexao');
            statusElem.innerText = "ONLINE";
            statusElem.className = "status-online";
            alterarEstadoControles(true);

            let term = document.getElementById('resposta-terminal');
            term.innerHTML = `root@AMHEEX-VPS ~# <span class="txt-azul">${mensagemConexao} [${id}]</span><br>root@AMHEEX-VPS ~# `;

            let agoraMs = new Date().getTime();
            let dadosAtualizacao = { 
                action: estadoActionAtual,
                data_hora: agoraMs
            };
            
            if (segundosExpiracaoUrl) {
                let segInt = parseInt(segundosExpiracaoUrl);
                if (!isNaN(segInt)) {
                    dadosAtualizacao.expiration = agoraMs + (segInt * 1000);
                }
            }

            fetch(`${FIREBASE_HOST}/STORAGE/${meuIdAtual}/CMD.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosAtualizacao)
            }).catch(err => console.error("Erro ao sincronizar parâmetros iniciais:", err));

            if (intervaloMonitoramento) clearInterval(intervaloMonitoramento);
            intervaloMonitoramento = setInterval(buscarDadosFirebase, 1000);
        }

        function alternarActionFirebase() {
            if (!meuIdAtual) return;
            estadoActionAtual = !estadoActionAtual;
            atualizarBotaoActionVisual();

            let agoraMs = new Date().getTime();
            fetch(`${FIREBASE_HOST}/STORAGE/${meuIdAtual}/CMD.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: estadoActionAtual, data_hora: agoraMs })
            }).catch(err => console.error("Erro ao alterar action:", err));
            focarInput();
        }

        function atualizarBotaoActionVisual() {
            let btn = document.getElementById('btnActionToggle');
            if (estadoActionAtual) {
                btn.innerText = "TRUE";
                btn.className = "btn-action active-true";
            } else {
                btn.innerText = "FALSE";
                btn.className = "btn-action active-false";
            }
        }

        function procurarEConectarIPAtivo() {
            if (modoManualUrl) return;

            fetch(`${FIREBASE_HOST}/STORAGE.json`)
                .then(response => response.json())
                .then(data => {
                    if (!data) {
                        if (meuIdAtual) desconectarSandbox("Sem servidores");
                        mostrarModalAviso();
                        return;
                    }

                    let ids = Object.keys(data);
                    let melhorId = "";
                    let menorDiferencaSegundos = 999999;
                    let agoraMs = new Date().getTime();

                    ids.forEach(id => {
                        let nodo = data[id];
                        if (nodo && nodo.CMD) {
                            let expirationMs = nodo.CMD.expiration ? parseInt(nodo.CMD.expiration) : 0;
                            let actVal = nodo.CMD.action;
                            
                            let diffRestante = expirationMs ? Math.max(0, Math.floor((expirationMs - agoraMs) / 1000)) : 0;

                            if (diffRestante <= 0 || (actVal === false || String(actVal).toLowerCase() === "false")) {
                                if (expirationMs > 0 && agoraMs >= expirationMs) {
                                    apagarSandboxExpirada(id);
                                }
                                if (meuIdAtual === id) desconectarSandbox("Expirado (0s)");
                                return;
                            }

                            if (diffRestante < menorDiferencaSegundos) {
                                menorDiferencaSegundos = diffRestante;
                                melhorId = id;
                            }
                        }
                    });

                    if (melhorId && melhorId !== meuIdAtual) {
                        conectarESincronizarID(melhorId, "Conectado via Modo Carreira (ID Ativo)");
                    } else if (melhorId && melhorId === meuIdAtual) {
                        fetch(`${FIREBASE_HOST}/STORAGE/${melhorId}/CMD.json`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: estadoActionAtual, data_hora: agoraMs })
                        }).catch(err => {});
                    } else if (!melhorId) {
                        if (meuIdAtual) desconectarSandbox("Expirado/Off");
                        mostrarModalAviso();
                    }
                })
                .catch(err => {
                    console.error("Erro ao varrer IDs:", err);
                    mostrarModalAviso();
                });
        }

        function desconectarSandbox(motivo) {
            if (modoManualUrl) return; 

            meuIdAtual = "";
            document.getElementById('info-id').innerText = "-";
            let statusElem = document.getElementById('status-conexao');
            statusElem.innerText = motivo;
            statusElem.className = "status-erro";
            document.getElementById('tempo-decorrido').innerText = "0";
            alterarEstadoControles(false);
            if (intervaloMonitoramento) clearInterval(intervaloMonitoramento);
            mostrarModalAviso();
        }

        function obterClasseCorTexto(texto) {
            let t = texto.toLowerCase();
            if (t.includes('erro') || t.includes('fail') || t.includes('falha') || t.includes('denied') || t.includes('error')) return 'txt-vermelho';
            if (t.includes('sucesso') || t.includes('success') || t.includes('ok') || t.includes('concluído')) return 'txt-verde';
            if (t.includes('aviso') || t.includes('warning') || t.includes('atenção')) return 'txt-amarelo';
            return 'txt-branco';
        }

        function atualizarUltimaLinhaTerminal() {
            let term = document.getElementById('resposta-terminal');
            let htmlAtual = term.innerHTML;
            
            let ultimaQuebra = htmlAtual.lastIndexOf("root@AMHEEX-VPS ~#");
            if (ultimaQuebra !== -1) {
                let base = htmlAtual.substring(0, ultimaQuebra + "root@AMHEEX-VPS ~#".length);
                term.innerHTML = base + ` <span class="txt-azul">${escapeHtml(comandoAtualDigitando)}</span>`;
                term.scrollTop = term.scrollHeight;
            }
        }

        function buscarDadosFirebase() {
            if (!meuIdAtual) return;

            fetch(`${FIREBASE_HOST}/STORAGE/${meuIdAtual}/CMD.json`)
                .then(response => response.json())
                .then(data => {
                    if (!data) {
                        if (!modoManualUrl) {
                            desconectarSandbox("Removido");
                            mostrarModalAviso();
                        }
                        return;
                    }

                    if (data.action === false || String(data.action).toLowerCase() === "false") {
                        if (!modoManualUrl) {
                            desconectarSandbox("Desativado");
                            mostrarModalAviso();
                            return;
                        }
                    }

                    if (data.expiration) {
                        let expirationMs = parseInt(data.expiration);
                        let agoraMs = new Date().getTime();
                        let segundosRestantes = Math.max(0, Math.floor((expirationMs - agoraMs) / 1000));
                        document.getElementById('tempo-decorrido').innerText = segundosRestantes;
                        
                        if (segundosRestantes <= 0 && !modoManualUrl) {
                            desconectarSandbox("Expirado (0s)");
                            mostrarModalAviso();
                            return;
                        }
                    } else {
                        if (!modoManualUrl) {
                            desconectarSandbox("Sem Expiração");
                            mostrarModalAviso();
                            return;
                        }
                    }

                    let corAtualRecebida = data.cor || data.color;
                    if (corAtualRecebida && corAtualRecebida !== ultimaCorProcessada) {
                        ultimaCorProcessada = corAtualRecebida;
                        let term = document.getElementById('resposta-terminal');
                        let classeCorDesejada = 'txt-branco';
                        let corLower = corAtualRecebida.toLowerCase();
                        if (corLower.includes('verde') || corLower.includes('green')) classeCorDesejada = 'txt-verde';
                        else if (corLower.includes('vermelho') || corLower.includes('red')) classeCorDesejada = 'txt-vermelho';
                        else if (corLower.includes('amarelo') || corLower.includes('yellow')) classeCorDesejada = 'txt-amarelo';
                        else if (corLower.includes('azul') || corLower.includes('blue')) classeCorDesejada = 'txt-azul';

                        term.innerHTML += `<span class="${classeCorDesejada}">[COR/TEMA] ${escapeHtml(corAtualRecebida)}</span><br>root@AMHEEX-VPS ~# `;
                        term.scrollTop = term.scrollHeight;
                    }

                    if (data.resposta && data.resposta !== ultimaRespostaProcessada) {
                        ultimaRespostaProcessada = data.resposta;
                        let term = document.getElementById('resposta-terminal');
                        
                        let ultimaQuebra = term.innerHTML.lastIndexOf("root@AMHEEX-VPS ~#");
                        if (ultimaQuebra !== -1) {
                            term.innerHTML = term.innerHTML.substring(0, ultimaQuebra);
                        }

                        let classeCor = obterClasseCorTexto(data.resposta);
                        term.innerHTML += `<span class="${classeCor}">${escapeHtml(data.resposta)}</span><br>root@AMHEEX-VPS ~# `;
                        comandoAtualDigitando = "";
                        document.getElementById('input-invisivel').value = "";
                        term.scrollTop = term.scrollHeight;
                    }
                })
                .catch(err => console.error("Erro:", err));
        }

        function enviarComandoDireto(cmd) {
            if (!meuIdAtual || !cmd.trim()) return;

            let term = document.getElementById('resposta-terminal');
            
            let ultimaQuebra = term.innerHTML.lastIndexOf("root@AMHEEX-VPS ~#");
            if (ultimaQuebra !== -1) {
                let base = term.innerHTML.substring(0, ultimaQuebra + "root@AMHEEX-VPS ~#".length);
                term.innerHTML = base + ` <span class="txt-azul">${escapeHtml(cmd)}</span><br><span class="txt-amarelo">Executando...</span><br>root@AMHEEX-VPS ~# `;
            }
            term.scrollTop = term.scrollHeight;

            let comandoParaEnviar = cmd;
            comandoAtualDigitando = "";
            document.getElementById('input-invisivel').value = "";

            let agoraMs = new Date().getTime();
            fetch(`${FIREBASE_HOST}/STORAGE/${meuIdAtual}/CMD.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comando: comandoParaEnviar, data_hora: agoraMs })
            }).catch(err => alert("Erro ao enviar comando: " + err));
            
            setTimeout(focarInput, 50);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
